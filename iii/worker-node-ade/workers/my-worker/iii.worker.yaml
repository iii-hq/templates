iii: v1
name: my-worker
language: javascript
deploy: bundle
manifest: package.json
license: Apache-2.0
tags: [example, node, console-ui]
description: Example worker — my-worker::hello, configuration, a my-worker:hello trigger type, a console page in the ADE and a plainer page over HTTP.

# Host development is the default: worker-compose.yaml runs `pnpm dev`.
# runtime:
#   base_image: docker.io/iiidev/node:latest

scripts:
  # Compose skips these in host mode. They are the portable bundle recipe.
  # `pnpm start` builds the page first, so install needs no build of its own.
  install: "pnpm install"
  start: "pnpm start"
