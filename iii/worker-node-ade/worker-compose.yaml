# Project workers for the iii engine.
# Docs: https://iii.dev/docs/next/using-iii/compose
#
# Start with:
#
#   iii compose --up
#
namespace: default
startup_timeout: 360s

engine:
  url: ws://127.0.0.1:49134

containers:
  # Host development. pre_run installs local node_modules before each start;
  # `pnpm dev` builds the page, then restarts the worker on every save.
  my-worker:
    worker: path://./workers/my-worker
    scripts:
      pre_run: pnpm install
      pre_run_timeout: 5m
      run: pnpm dev

  # Serves the standalone page on http://127.0.0.1:3111/my-worker.
  # No auth: never expose port 3111 through a public proxy or tunnel.
  http:
    worker: package://http
    version: latest
    config_name: http

  # The ADE on http://127.0.0.1:3113 shows the same page as a console page.
  # ade:
  #   worker: package://ade
  #   version: latest
