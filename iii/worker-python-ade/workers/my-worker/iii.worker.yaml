iii: v1
name: my-worker
language: python
deploy: bundle
manifest: pyproject.toml
license: Apache-2.0
tags: [example, python, console-ui]
description: Example Python worker — my-worker::hello, settings, a trigger type and one page in the ADE and over HTTP.

# Host development is the default. For a VM run, build the page on the host
# first (cd ui && pnpm install && pnpm build; the VM image has no Node), then
# uncomment this block and remove the host scripts block from worker-compose.yaml.
# runtime:
#   base_image: docker.io/iiidev/python:latest

scripts:
  # Compose skips this in host mode. It is the portable VM/bundle install recipe.
  install: "python -m pip install -e ."
  start: "watchfiles 'python src/main.py'"
