iii: v1
name: my-worker
language: python
deploy: bundle
manifest: pyproject.toml
license: Apache-2.0
tags: [example, python, console-ui]
description: Example Python worker — my-worker::hello, settings, a trigger type, a public page over HTTP and an admin page in the ADE.

# Host development is the default. A VM run starts without the pages unless pnpm
# is available in the guest (the VM copy excludes dist/, and the image has no
# Node). To run in a VM, uncomment this block and remove the host scripts block
# from worker-compose.yaml.
# runtime:
#   base_image: docker.io/iiidev/python:latest

scripts:
  # Compose skips install in host mode. It is the portable VM/bundle install recipe.
  # Host mode runs start when the compose entry has no run of its own.
  install: "python -m pip install -e ."
  start: "sh scripts/start.sh"
