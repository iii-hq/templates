# Project workers for the iii engine.
# Docs: https://iii.dev/docs/next/using-iii/compose
#
# pre_run prepares a private venv and builds the page (scripts/start.sh). Start with:
#
#   iii compose --up
#
namespace: default
startup_timeout: 360s

engine:
  url: ws://127.0.0.1:49134

containers:
  # Host development. Hooks run from the worker directory. scripts/start.sh
  # reuses a private venv, installs the worker into it, then builds the page
  # into dist/ (dist/ui for the ADE, dist/web for http://127.0.0.1:3111/my-worker).
  # pre_run does that up front; without it, the first start does it. A crash
  # ends the worker, and `restart: on-failure` retries with backoff before
  # `failed`.
  my-worker:
    worker: path://./workers/my-worker
    restart: on-failure
    scripts:
      pre_run: "sh scripts/start.sh --prepare"
      pre_run_timeout: 5m
      run: "sh scripts/start.sh"

  # Serves the page and its API on http://127.0.0.1:3111/my-worker. No auth:
  # never expose port 3111 through a public proxy or tunnel.
  http:
    worker: package://http
    version: latest
    config_name: http

  # The ADE on http://127.0.0.1:3113 shows a console-native page that links to it.
  # ade:
  #   worker: package://ade
  #   version: latest
