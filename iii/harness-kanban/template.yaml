name: Harness + Kanban
description: A iii-powered harness plus a kanban board with agent profiles that plan, build and review work as tickets
version: "0.23.0"
# min_iii_version: "0.22.0"

treat_required_as_included: true
requires:
  - typescript # no language is needed, workaround for old logic TODO: fix
optional: []

# Explicit list of files to copy (shared_files from root are added automatically)
files:
  - .env
  - README.md
  - worker-compose.yaml

next_steps:
  - 'Open README.md for simple step by step instructions to configure and start the harness'
  - 'Open the board at http://127.0.0.1:3113/#/ext/kanban-board and pick an agent profile in the console; README.md explains the workflow'
