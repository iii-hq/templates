name: Bare
description: Minimal iii project scaffold — worker-compose.yaml and the console.
version: "0.23.0"
min_iii_version: "0.23.0"

# No language requirements: this template is the bare scaffold used by
# `iii project init`. Workers are added later via
# `iii trigger compose::add worker=<path-or-name>` or by scaffolding from a
# worker-bearing template like `quickstart`.
treat_required_as_included: true
requires: []
optional: []

# worker-compose.yaml is local to this template; .gitignore comes from the root
# template.yaml's `shared_files` (default-gitignore -> .gitignore). `config.yaml`
# is not scaffolded: `iii compose --up` does not need one, a standalone `iii`
# writes an empty one on first start, and project workers belong in
# worker-compose.yaml. `data/` is iii-state managed by the engine at runtime,
# not part of the scaffold; it's already in default-gitignore so users don't
# accidentally commit it.
files:
  - README.md
  - worker-compose.yaml
  - .env

next_steps:
  - "Start the engine and the console: iii compose --up"
  - "Open the console: http://127.0.0.1:3113"
  - "Add more workers: uncomment a block in worker-compose.yaml, or run iii trigger compose::add"
  - "Docs: https://iii.dev/docs/quickstart"
