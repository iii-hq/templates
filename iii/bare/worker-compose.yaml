# Project workers for the iii engine.
# Docs: https://iii.dev/docs/next/using-iii/compose
#
# Start everything with one command:
#
#   iii compose --up
#
# The engine's default namespace. Change it only when one project runs several
# tenants that need their own copy of the same worker.
# Docs: https://iii.dev/docs/next/using-iii/namespaces
namespace: default
startup_timeout: 360s

engine:
  url: ws://127.0.0.1:49134

containers:
  # Web UI on http://127.0.0.1:3113 — workers, functions, config, traces.
  console:
    worker: package://console
    version: "1.9.17"

  # ---------------------------------------------------------------------------
  # LLM base. `state` and `llm-router` power the providers below. `llm-router`
  # reads every provider key from the `.env` file next to this one.
  state:
    worker: package://state
    version: "0.22.5-rc.1"
    working_dir: .

  llm-router:
    worker: package://llm-router
    version: "1.4.15-rc.5"
    start_after: [state]
    env_file: ['./.env']

  # ---------------------------------------------------------------------------
  # Providers. `provider-anthropic` and `provider-openai` are enabled. Add your
  # key to `.env` (ANTHROPIC_API_KEY / OPENAI_API_KEY). To use another provider,
  # uncomment its block and add its key to `.env`.
  provider-anthropic:
    worker: package://provider-anthropic
    version: "1.2.12-rc.2"
    start_after: [state, llm-router]

  provider-openai:
    worker: package://provider-openai
    version: "1.2.9-rc.4"
    start_after: [state, llm-router]

  #  provider-deepseek:            # DEEPSEEK_API_KEY
  #    worker: package://provider-deepseek
  #    version: "0.1.9-rc.3"
  #    start_after: [state, llm-router]

  #  provider-kimi:                # MOONSHOT_API_KEY, not KIMI_API_KEY
  #    worker: package://provider-kimi
  #    version: "1.1.7-rc.3"
  #    start_after: [state, llm-router]

  #  provider-xai:                 # XAI_API_KEY
  #    worker: package://provider-xai
