# Project workers for the iii engine.
# Docs: https://iii.dev/docs/next/using-iii/compose
#
# Start everything with one command:
#
#   iii compose --up
#
# The engine's default namespace. Change it only when one project runs several
# tenants that need their own copy of the same worker.
# Docs: https://iii.dev/docs/next/using-iii/namespaces
namespace: default
startup_timeout: 360s

engine:
  url: ws://127.0.0.1:49134

containers:
  # Web UI on http://127.0.0.1:3113 — workers, functions, config, traces.
  console:
    worker: package://console
    version: "1.9.15"

  # ---------------------------------------------------------------------------
  # Optional: persistent key-value store, used by most other workers.
  #
  #  state:
  #    worker: package://state
  #    version: "0.22.2"
  #    working_dir: .

  # Optional: durable job queue with retries and a dead-letter queue.
  #
  #  queue:
  #    worker: package://queue
  #    version: "0.21.6"
  #    working_dir: .

  # Optional: scheduled triggers.
  #
  #  cron:
  #    worker: package://cron
  #    version: "0.21.10"

  # Optional: SQL database (SQLite and Postgres).
  #
  #  database:
  #    worker: package://database
  #    version: "0.5.4"
  #    working_dir: .

  # Optional: HTTP server that exposes functions as REST endpoints.
  #
  #  http:
  #    worker: package://http
  #    version: "0.21.4"

  # ---------------------------------------------------------------------------
  # Optional: the agent harness — a coding agent inside the console.
  #
  # Uncomment every block below, plus `state`, `queue` and `cron` above. Add a
  # `.env` file next to this one with the provider key you use:
