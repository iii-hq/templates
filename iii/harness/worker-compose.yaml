# The engine's default namespace. Change it when you have a project with multiple
# tenants that need to run the same workers (ex. 2 copies of state).
# Refer to https://iii.dev/docs/next/using-iii/namespaces for more information.
namespace: default

startup_timeout: 360s
stop_timeout: 30s

# Refer to https://iii.dev/docs/next/using-iii/compose for more information
# about using compose and setting up a worker-compose.yaml file.
#
# Credentials come from the shell that runs the compose daemon. Export your keys
# there and `${VAR}` below picks them up. `:-` gives an unset variable an empty
# default, so a missing key never blocks compose::up.
containers:
  state:
    worker: package://state
    version: "0.22.2"
    working_dir: .

  queue:
    worker: package://queue
    version: "0.21.5"
    working_dir: .

  cron:
    worker: package://cron
    version: "0.21.9"

  shell:
    worker: package://shell
    version: "0.11.9"
    working_dir: .

  session-manager:
    worker: package://session-manager
    version: "1.0.13"

  iii-directory:
    worker: package://iii-directory
    version: "1.2.3"

  llm-router:
    worker: package://llm-router
    version: "1.4.12"
    start_after: [state]
    # Every provider key resolves in the router's process, not in the provider
    # worker. A key set anywhere else reads back as `configured: false`.
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Uncomment the line for each extra provider you enable below.
      # DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # MOONSHOT_API_KEY: "${MOONSHOT_API_KEY:-}"
      # XAI_API_KEY: "${XAI_API_KEY:-}"
      # ZAI_API_KEY: "${ZAI_API_KEY:-}"
      # OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # LLAMACPP_API_KEY: "${LLAMACPP_API_KEY:-}"

  provider-anthropic:
    worker: package://provider-anthropic
    version: "1.2.8"
    start_after: [state, llm-router]

  provider-openai:
    worker: package://provider-openai
    version: "1.2.7"
    start_after: [state, llm-router]

  provider-openai-codex:
    worker: package://provider-openai-codex
    version: "0.4.4"
    start_after: [state, llm-router]

  # Additional providers that use API Keys
  #
  # Uncomment a block, uncomment its key under llm-router's `environment`,
  # export that key, and restart the compose daemon so it re-reads this file.

  #  provider-deepseek:            # DEEPSEEK_API_KEY
  #    worker: package://provider-deepseek
  #    version: "0.1.6"
  #    start_after: [state, llm-router]

  #  provider-kimi:                # MOONSHOT_API_KEY, not KIMI_API_KEY
  #    worker: package://provider-kimi
  #    version: "1.1.5"
  #    start_after: [state, llm-router]

  #  provider-xai:                 # XAI_API_KEY
  #    worker: package://provider-xai
  #    version: "1.3.4"
  #    start_after: [state, llm-router]

  #  provider-zai:                 # ZAI_API_KEY
  #    worker: package://provider-zai
  #    version: "0.5.4"
  #    start_after: [state, llm-router]

  #  provider-openrouter:          # OPENROUTER_API_KEY
  #    # Latest stable release; not compatible with state 0.22.2 yet.
  #    worker: package://provider-openrouter
  #    version: "0.1.2"
  #    start_after: [state, llm-router]

  #  provider-llamacpp:            # LLAMACPP_API_KEY
  #    worker: package://provider-llamacpp
  #    version: "0.3.1"
  #    start_after: [state, llm-router]

  # Providers that do not require an API Key
  # Note: These providers are experimental.
  #
  #   provider-claude-code     reads ~/.claude/.credentials.json, written by the
  #                            Claude Code CLI when you sign in there
  #   provider-github-copilot  no file and no env var: it runs a GitHub device
  #                            flow. Run iii trigger provider::github-copilot::login::start,
  #                            enter the user_code it returns at the verification
  #                            URL, then call iii trigger provider::github-copilot::login::poll.

  #  provider-claude-code:
  #    worker: package://provider-claude-code
  #    version: "0.1.5"
  #    start_after: [state, llm-router]

  #  provider-github-copilot:
  #    worker: package://provider-github-copilot
  #    version: "0.1.2"
  #    start_after: [state, llm-router]

  context-manager:
    worker: package://context-manager
    version: "1.1.3"
    start_after: [llm-router]

  harness:
    worker: package://harness
    version: "1.8.5"
    start_after:
      - console
      - context-manager
      - cron
      - iii-directory
      - llm-router
      - provider-anthropic
      - provider-openai
      - provider-openai-codex
      - queue
      - session-manager
      - shell
      - state

  console:
    worker: package://console
    version: "1.9.11"
