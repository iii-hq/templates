namespace: default
startup_timeout: 15m
stop_timeout: 10s

engine:
  url: ws://127.0.0.1:49135

containers:
  queue:
    worker: package://queue
    version: "0.21.7-rc.3"

  state:
    worker: package://state
    version: "0.22.3-rc.3"

  session-manager:
    worker: package://session-manager
    version: "1.0.14-rc.3"

  llm-router:
    worker: package://llm-router
    version: "1.4.15-rc.4"
    env_file:
      - ./.env
    start_after:
      - state
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

  provider-openai-codex:
    worker: package://provider-openai-codex
    version: "0.4.6-rc.4"
    start_after:
      - llm-router
      - state

  provider-openai:
    worker: package://provider-openai
    version: "1.2.9-rc.3"
    start_after:
      - llm-router
      - state
    environment:
      RUST_LOG: info

  provider-anthropic:
    worker: package://provider-anthropic
    version: "1.2.11-rc.3"
    start_after:
      - llm-router
      - state

  context-manager:
    worker: package://context-manager
    version: "1.1.4-rc.3"
    start_after:
      - llm-router

  iii-directory:
    worker: package://iii-directory
    version: "1.2.5-rc.2"

  cron:
    worker: package://cron
    version: "0.21.11-rc.1"

  console:
    worker: package://console
    version: "1.9.15-rc.5"

  shell:
    worker: package://shell
    version: "0.11.13-rc.3"

  harness:
    worker: package://harness
    version: "1.8.8-rc.2"
    start_after:
      - state
      - queue
      - session-manager
      - llm-router
      - provider-openai-codex
      - provider-openai
      - provider-anthropic
      - context-manager
      - iii-directory
      - cron
      - shell

  web:
    worker: package://web
    version: "1.2.11-rc.1"
