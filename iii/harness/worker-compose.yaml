namespace: default
startup_timeout: 360s
stop_timeout: 10s

engine:
  url: ws://127.0.0.1:49134

containers:
  queue:
    worker: package://queue
    version: "latest"

  state:
    worker: package://state
    version: "latest"

  session-manager:
    worker: package://session-manager
    version: "latest"

  llm-router:
    worker: package://llm-router
    version: "latest"
    start_after:
      - state
    environment:
      RUST_LOG: info

  # Keeps provider keys for llm-router: pasted in the ADE and stored
  # encrypted (secret://NAME), or kept in ./.env and read from there each
  # time they are used (env://NAME).
  #
  # No model provider is declared here. On the first visit, the ADE's setup
  # wizard adds the provider you choose (compose::add) and connects its key.
  secrets:
    worker: package://secrets
    version: "latest"

  context-manager:
    worker: package://context-manager
    version: "latest"
    start_after:
      - llm-router

  iii-directory:
    worker: package://iii-directory
    version: "latest"

  cron:
    worker: package://cron
    version: "latest"

  ade: # the ADE web UI (registers console::*)
    worker: package://ade
    version: "latest"

  ide: # files and commands for agents and the ADE (registers shell::* and coder::*)
    worker: package://ide
    version: "latest"

  harness:
    worker: package://harness
    version: "latest"
    start_after:
      - state
      - queue
      - session-manager
      - llm-router
      - context-manager
      - iii-directory
      - cron
      - ide

  browser: # Chromium sessions + one-shot fetches (browser::fetch) for verification
    worker: package://browser
    version: "latest"
