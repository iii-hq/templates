namespace: default
startup_timeout: 360s
stop_timeout: 10s

engine:
  url: ws://127.0.0.1:49134

containers:
  queue:
    worker: package://queue
    version: "latest"

  state:
    worker: package://state
    version: "latest"

  session-manager:
    worker: package://session-manager
    version: "latest"

  llm-router:
    worker: package://llm-router
    version: "latest"
    start_after:
      - state
    environment:
      RUST_LOG: info

  # Keeps provider keys for llm-router: pasted in the ADE and stored
  # encrypted (secret://NAME), or kept in ./.env and read from there each
  # time they are used (env://NAME). Connect a key in the ADE: the setup
  # wizard on the first visit, or Configure in the model picker.
  secrets:
    worker: package://secrets
    version: "latest"

  provider-anthropic:
    worker: package://provider-anthropic
    version: "latest"
    start_after:
      - llm-router
      - state

  provider-openai:
    worker: package://provider-openai
    version: "latest"
    start_after:
      - llm-router
      - state
    environment:
      RUST_LOG: info

  # Enabled by default; its key is optional.
  provider-deepseek:            # DEEPSEEK_API_KEY
    worker: package://provider-deepseek
    version: "latest"
    start_after:
      - llm-router
      - state

  # Additional providers. Uncomment a block and run
  # `iii trigger compose::restart` so compose re-reads this file, then connect
  # its key in the ADE (Configure in the model picker). Add the container to
  # the `harness` start_after list below if the harness should wait for it.

  #  provider-kimi:                # MOONSHOT_API_KEY, not KIMI_API_KEY
  #    worker: package://provider-kimi
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  #  provider-xai:                 # XAI_API_KEY
  #    worker: package://provider-xai
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  #  provider-zai:                 # ZAI_API_KEY
  #    worker: package://provider-zai
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  #  provider-openrouter:          # OPENROUTER_API_KEY
  #    worker: package://provider-openrouter
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  #  provider-llamacpp:            # LLAMACPP_API_KEY
  #    worker: package://provider-llamacpp
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  # Providers that need no API key (experimental):
  #   provider-openai-codex    reads ~/.codex/auth.json, written by the Codex CLI
  #                            when you sign in there.
  #   provider-claude-code     reads ~/.claude/.credentials.json, written by the
  #                            Claude Code CLI when you sign in there.
  #   provider-github-copilot  runs a GitHub device flow. Run
  #                            iii trigger provider::github-copilot::login::start,
  #                            enter the user_code at the verification URL, then
  #                            iii trigger provider::github-copilot::login::poll.

  #  provider-openai-codex:
  #    worker: package://provider-openai-codex
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  #  provider-claude-code:
  #    worker: package://provider-claude-code
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  #  provider-github-copilot:
  #    worker: package://provider-github-copilot
  #    version: "latest"
  #    start_after:
  #      - llm-router
  #      - state

  context-manager:
    worker: package://context-manager
    version: "latest"
    start_after:
      - llm-router

  iii-directory:
    worker: package://iii-directory
    version: "latest"

  cron:
    worker: package://cron
    version: "latest"

  ade: # the ADE web UI (registers console::*)
    worker: package://ade
    version: "latest"

  ide: # files and commands for agents and the ADE (registers shell::* and coder::*)
    worker: package://ide
    version: "latest"

  harness:
    worker: package://harness
    version: "latest"
    start_after:
      - state
      - queue
      - session-manager
      - llm-router
      - provider-openai
      - provider-anthropic
      - context-manager
      - iii-directory
      - cron
      - ide

  browser: # Chromium sessions + one-shot fetches (browser::fetch) for verification
    worker: package://browser
    version: "latest"
