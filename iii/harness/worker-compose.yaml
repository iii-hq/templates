namespace: default
startup_timeout: 360s
stop_timeout: 10s

engine:
  url: ws://127.0.0.1:49134

containers:
  queue:
    worker: package://queue
    version: "latest"

  state:
    worker: package://state
    version: "latest"

  session-manager:
    worker: package://session-manager
    version: "latest"

  llm-router:
    worker: package://llm-router
    version: "latest"
    start_after:
      - state
    environment:
      RUST_LOG: info

  # Keeps provider keys for llm-router: pasted in the ADE and stored
  # encrypted (secret://NAME), or kept in ./.env and read from there each
  # time they are used (env://NAME).
  #
  # No model provider is declared here. On the first visit, the ADE's setup
  # wizard adds the provider you choose (compose::add) and connects its key.
  secrets:
    worker: package://secrets
    version: "latest"

  context-manager:
    worker: package://context-manager
    version: "latest"
    start_after:
      - llm-router

  iii-directory:
    worker: package://iii-directory
    version: "latest"

  cron:
    worker: package://cron
    version: "latest"

  ade: # the ADE web UI (registers ade::*)
    worker: package://ade
    version: "latest"

  ide: # files and commands for agents and the ADE (registers shell::* and coder::*)
    worker: package://ide
    version: "latest"

  harness:
    worker: package://harness
    version: "latest"
    start_after:
      - state
      - queue
      - session-manager
      - llm-router
      - context-manager
      - iii-directory
      - cron
      - ide

  browser: # Chromium sessions + one-shot fetches (browser::fetch) for verification
    worker: package://browser
    version: "latest"

  # Serves the pages agents build and mcp-server's /mcp endpoint, on port
  # 3111 (configuration entry `http`).
  #
  # Bound to this machine only. To open the pages from other devices on your
  # network, set `host: 0.0.0.0` instead. That is risky: on a machine connected
  # directly to the internet, or on a public network (cafe, hotel, airport),
  # anyone who can reach this machine can then open them, and the pages have
  # no authentication. mcp-server also stops serving /mcp while http listens
  # beyond this machine.
  http:
    worker: package://http
    version: "latest"
    config_name: http
    config_override:
      host: 127.0.0.1

  # The access-control door mcp-server connects through: it decides what MCP
  # clients (Claude Code, Codex, Cursor, ...) may call. `loopback_auth` admits
  # connections from this machine only, with no auth function or token to set
  # up: every local process can already reach the engine port directly.
  # `expose_functions` is what agents may call; narrow it to limit them.
  rbac-proxy:
    worker: package://rbac-proxy
    version: "latest"
    config_override:
      host: 127.0.0.1
      port: 49200
      engine_url: ws://127.0.0.1:49134
      rbac:
        loopback_auth:
          worker_names: [mcp-server]
          # mcp-server registers its own functions; under a prefix, so no local
          # process can take a function id another worker is meant to hold.
          allow_function_registration: true
          function_registration_prefix: mcp
          # Agents store secrets with iii_secret_store; none may read one back.
          forbidden_functions: ["secrets::resolve"]
        expose_endpoints: ['match("/")', 'match("/ws/channels/*")', 'match("/otel")']
        expose_functions: ['match("*")']

  # MCP server for this project at http://127.0.0.1:3111/mcp: the iii plugin
  # for Claude Code (iii-hq/agent-plugins-claude) and any MCP client connect
  # here. It reaches the engine through rbac-proxy.
  mcp-server:
    worker: package://mcp-server
    version: "latest"
    start_after:
      - http
      - rbac-proxy
      - secrets
      - iii-directory
    environment:
      III_MCP_ENGINE_URL: ws://127.0.0.1:49200
