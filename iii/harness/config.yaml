# Engine configuration for the harness/console template.

# The worker list is empty on purpose. Every service this project needs is a
# part of worker-compose.yaml. If you are using compose you should
# leave this workers list empty.

# The engine's internal services are always present and are never listed: the
# WebSocket listener, the configuration worker, iii-observability and iii-stream.
# harness depends on the last three, and gets them from the engine for free.
workers: []
