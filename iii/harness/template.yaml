name: Harness
description: Build with agents in the ADE, the iii agent workspace
version: "0.27.0"
# min_iii_version: "0.22.0"

treat_required_as_included: true
requires:
  - typescript # no language is needed, workaround for old logic TODO: fix
optional: []

# The root language_files would drop it: the setup wizard's example prompts.
language_files:
  common:
    - 'onboarding.yaml'

# Explicit list of files to copy (shared_files from root are added automatically)
files:
  - README.md
  - worker-compose.yaml
  - onboarding.yaml

next_steps:
  - 'Run: iii compose --up'
  - 'Open http://127.0.0.1:3113 in your browser and continue with the setup wizard'
