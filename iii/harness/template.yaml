name: Harness
description: Build with agents in the ADE, the iii agent workspace
version: "0.23.0"
# min_iii_version: "0.22.0"

treat_required_as_included: true
requires:
  - typescript # no language is needed, workaround for old logic TODO: fix
optional: []

# Explicit list of files to copy (shared_files from root are added automatically)
files:
  - README.md
  - worker-compose.yaml
  - agents/ade-worker-builder.md
  - agents/agent-profile-creator.md
  - skills/harness/ade-worker-design/console-design.md
  - skills/harness/ade-worker-design/console-injectable-ui.md
  - skills/harness/ade-worker-design/index.md
  - skills/harness/ade-worker-design/patterns.md
  - skills/harness/ade-worker-design/planning.md
  - skills/harness/frontend/frontend-testing.md
  - skills/harness/frontend/iii-browser-sdk.md
  - skills/harness/frontend/index.md
  - skills/harness/frontend/react.md
  - skills/harness/frontend/tanstack-query.md
  - skills/harness/frontend/tanstack-router.md
  - skills/harness/frontend/vite.md
  - skills/harness/frontend/web-accessibility.md
  - skills/harness/frontend/web-performance.md
  - skills/harness/iii-node/architecture.md
  - skills/harness/iii-node/configuration.md
  - skills/harness/iii-node/index.md
  - skills/harness/orchestration/index.md
  - skills/harness/orchestration/report.md

next_steps:
  - 'Have an API key for one AI provider ready: the setup wizard in the ADE connects it on the first visit, encrypted or kept in .env (README.md, step 1)'
  - 'Run: iii compose --up (leave it running), then open the ADE at http://127.0.0.1:3113 (README.md, step 3, if that address does not answer)'
  - 'Start a conversation with "Create an app or tool" and send the first-app example from README.md, step 5, or describe your own in one line. You do not need to create a custom agent first'
