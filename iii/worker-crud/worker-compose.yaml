# Project workers for the iii engine.
# Docs: https://iii.dev/docs/next/using-iii/compose
#
# Start with:
#
#   iii compose --up
#
namespace: default
startup_timeout: 360s

engine:
  url: ws://127.0.0.1:49134

containers:
  # Host development. pre_run installs local node_modules before each start;
  # scripts/dev.mjs (what `pnpm dev` runs, started without pnpm staying
  # resident) builds the page, then restarts the worker on every save. A crash
  # ends it, and `restart: on-failure` retries with backoff before `failed`.
  my-worker:
    worker: path://./workers/my-worker
    restart: on-failure
    scripts:
      pre_run: pnpm install
      pre_run_timeout: 5m
      run: node scripts/dev.mjs
    # Records live in engine state (state::get / state::set).
    start_after: [state]

  # Serves the public page on http://127.0.0.1:3111/my-worker.
  # No auth: never expose port 3111 through a public proxy or tunnel. The http
  # worker binds 0.0.0.0 unless told otherwise, so a fresh project seeds it
  # with loopback only; an http configuration already stored is kept.
  http:
    worker: package://http
    version: latest
    config_name: http
    config_override:
      host: 127.0.0.1

  # Engine state: where the records are stored.
  state:
    worker: package://state
    version: latest
    config_name: state

  # The ADE on http://127.0.0.1:3113 shows a console-native page that links to it.
  # ade:
  #   worker: package://ade
  #   version: latest
