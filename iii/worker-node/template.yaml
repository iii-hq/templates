name: Worker (Node)
description: A minimal Node/TypeScript worker project — host development with local dependencies, plus an optional VM check before publishing.
version: "0.23.0"
min_iii_version: "0.23.0"

treat_required_as_included: true
requires:
  - typescript
optional: []

# Explicit list of files to copy (shared_files from root are added automatically)
files:
  - README.md
  - worker-compose.yaml
  - workers/hello-node/iii.worker.yaml
  - workers/hello-node/package.json
  - workers/hello-node/tsconfig.json
  - workers/hello-node/src/greet.ts
  - workers/hello-node/src/index.ts
  - workers/hello-node/tests/greet.test.ts

next_steps:
  - 'In terminal 1 from the project root, start Compose: iii compose --up'
  - 'Compose pre_run installs dependencies into local node_modules automatically'
  - 'In terminal 2 from the project root, call: iii trigger hello-node::greet name=World'
  - 'Edit workers/hello-node/src/ — the host worker reloads on save'
  - 'Optional VM and publishing checks: see README.md'
