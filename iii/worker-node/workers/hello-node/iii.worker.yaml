iii: v1
name: hello-node
language: javascript
deploy: bundle
manifest: package.json
license: Apache-2.0
tags: [example, node]
description: Minimal Node worker — hello-node::greet returns a greeting.

# Host development is the default. For the optional VM check, uncomment this
# block and remove the host scripts block from worker-compose.yaml; Compose then
# writes the VM scripts (iii sandbox build/run) there. See README.md.
# runtime:
#   base_image: docker.io/iiidev/node:latest

scripts:
  # Compose skips this in host mode. In a VM, `iii sandbox build` runs it into
  # the worker's image; it is also the bundle install recipe.
  install: "npm install"
  start: "npm run start"
